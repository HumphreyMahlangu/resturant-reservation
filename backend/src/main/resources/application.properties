spring.config.import=optional:file:.env[.properties]
spring.application.name=reservation-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:h2:file:./data/maison-verre;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Change these values in backend/.env before sharing the application.
app.admin.email=${APP_ADMIN_EMAIL:admin@maisonverre.local}
app.admin.password=${APP_ADMIN_PASSWORD:change-me-now}
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:VGhpcy1pcy1hLWRldi1zZWNyZXQta2V5LWZvci1tYWlzb24tdmVycmUtaXMtMzItYnl0ZXM=}
app.security.jwt-expiration=${APP_SECURITY_JWT_EXPIRATION:PT8H}
